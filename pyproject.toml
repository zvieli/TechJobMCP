[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-mcp"
version = "0.1.0"
description = "FastMCP Server for Universal Multi-Source Tech Job Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "pypdf>=4.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "rich>=13.0",
]
ml = [
    "fastembed>=0.4.0",
]
training = [
    "laya>=0.3.5",
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "safetensors>=0.4.0",
    "accelerate>=0.26.0",
]

[project.scripts]
job-mcp-setup = "job_mcp.setup:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
