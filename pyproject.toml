[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-mcp"
version = "0.1.0"
description = "FastMCP Server for Universal Multi-Source Tech Job Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "pypdf>=4.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
job-mcp-setup = "job_mcp.setup:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
