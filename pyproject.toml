[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hireme-mcp"
version = "0.1.0"
description = "FastMCP Server for HireMeTech job search and application automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hireme-mcp-setup = "hireme_mcp.setup:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
