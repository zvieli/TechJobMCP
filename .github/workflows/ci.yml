name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: PR Quality, Tests & Evaluation Framework
    runs-on: ubuntu-latest

    env:
      # Zero-cost, CPU-only execution: no paid LLM providers, no GPU, no network tests.
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENABLE_INT8_QUANTIZATION: "true"
      TORCH_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        # This keeps the existing CPU wheel link. Clean-checkout CPU resolution is
        # intentionally not asserted until it has been separately reproduced.
        run: >
          uv sync
          --python 3.12
          --extra dev
          --extra ml
          --extra training
          --find-links https://download.pytorch.org/whl/cpu

      - name: Install Playwright Chromium with system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Milestone 1 Python lint gate
        # Repository-wide Ruff debt is recorded below; this blocking gate covers
        # only Milestone-1-owned Python files, without adding global ignores.
        run: >
          uv run ruff check
          tests/evaluation/test_evaluation_gates.py
          tests/conftest.py
          tests/test_cli_runner.py

      - name: Record repository-wide Ruff debt (non-blocking)
        if: always()
        run: |
          uv run ruff check . --output-format=concise > ruff-debt.txt || true
          printf 'Repository-wide Ruff findings are non-blocking legacy technical debt.\n' >> ruff-debt.txt

      - name: Upload repository-wide Ruff debt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-debt-${{ github.run_id }}
          path: ruff-debt.txt
          if-no-files-found: error

      - name: Full test suite
        run: uv run pytest tests/ -v --tb=short

      - name: Evaluation Framework / Plumbing Tests
        # No Laya model or holdout artifact is downloaded in PR CI. Real-model
        # diagnostics skip explicitly when those ignored artifacts are absent.
        run: uv run pytest tests/evaluation/test_evaluation_gates.py -v