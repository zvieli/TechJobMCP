name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality Gates, Tests & Model Evaluation
    runs-on: ubuntu-latest

    env:
      # Zero-cost, CPU-only execution: no paid LLM providers, no GPU, no network tests.
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENABLE_INT8_QUANTIZATION: "true"
      TORCH_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (CPU-only PyTorch)
        # Bind torch to the CPU wheel index so multi-gigabyte CUDA wheels are never
        # downloaded on the runner.
        run: >
          uv sync
          --python 3.12
          --extra dev
          --extra ml
          --extra training
          --find-links https://download.pytorch.org/whl/cpu

      - name: Install Playwright Chromium with system dependencies
        run: uv run playwright install --with-deps chromium

      - name: Code quality gate (ruff)
        run: uv run ruff check .

      - name: Full test suite
        run: uv run pytest tests/ -v --tb=short

      - name: Model evaluation gate
        run: uv run pytest tests/evaluation/test_evaluation_gates.py -v