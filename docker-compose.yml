services:
  techjob-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techjob-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Optional so `docker compose config` validates from a clean checkout.
      # The Milestone 4 contract values are declared explicitly below instead of
      # depending on developer-local secrets in .env.
      - path: .env
        required: false
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./data:/app/data
      - ./job_mcp:/app/job_mcp
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./cv.pdf:/app/cv.pdf:ro
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - BROWSER_HEADLESS=true
      - BROWSER_PROFILE_DIR=/app/browser_profile
      - DEFAULT_CV_PATH=/app/cv.pdf
      - APPLICATION_LEDGER_PATH=/app/data/application_ledger.db
      - LLM_CACHE_PATH=/app/data/llm_cache.db
      - JOB_TRACKER_PATH=/app/data/job_tracker.json
      - LAYA_MODEL_PATH=/app/data/models/laya-techjob
      - OLLAMA_URL=http://ollama:11434/api/generate
      - SOURCE_TIMEOUT_SECONDS=15.0
      - ENABLE_INT8_QUANTIZATION=true
      - TORCH_NUM_THREADS=4
      - MAX_NEURAL_EVAL=15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: techjob-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - techjob-mcp

  grafana:
    image: grafana/grafana:11.2.0
    container_name: techjob-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  ollama:
    image: ollama/ollama:latest
    container_name: techjob-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      # Daemon-readiness probe only. Gating health on a specific model name made
      # the service permanently unhealthy on any volume without that exact model,
      # and because ollama-model-pull needs ollama to be healthy first, that
      # turned into a startup deadlock. Model presence is ollama-model-pull's job.
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: techjob-ollama-pull
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Bounded startup: caps the model transfer so a stalled registry cannot
      # leave techjob-mcp waiting forever on service_completed_successfully.
      - OLLAMA_PULL_TIMEOUT_SECONDS=${OLLAMA_PULL_TIMEOUT_SECONDS:-900}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Compose's service_healthy gate replaces the old unbounded sleep-polling
    # loop. set -e plus a hard pull deadline make any failure exit non-zero, so
    # techjob-mcp cannot start against a missing model while reporting green.
    # Every shell variable below is written with doubled dollars because Compose
    # un-escapes them into the single-dollar form the container shell expands.
    command:
      - |
        set -e
        TARGET_MODEL="$${OLLAMA_MODEL:-llama3.2}"
        PULL_DEADLINE="$${OLLAMA_PULL_TIMEOUT_SECONDS:-900}"
        # GNU `timeout 0` means "no timeout at all", and a non-numeric value
        # makes timeout fail outright. Normalise any empty, non-numeric or
        # non-positive setting back to the 900s default so the bound cannot be
        # silently disabled by configuration. Values of 10+ digits are rejected
        # because they overflow shell arithmetic comparisons, and any accepted
        # deadline is clamped to 24h so the bound is always real.
        case "$${PULL_DEADLINE}" in
          "" | *[!0-9]*) PULL_DEADLINE=900 ;;
        esac
        if [ "$${#PULL_DEADLINE}" -ge 10 ]; then
          PULL_DEADLINE=900
        fi
        if [ "$${PULL_DEADLINE}" -le 0 ]; then
          PULL_DEADLINE=900
        fi
        if [ "$${PULL_DEADLINE}" -gt 86400 ]; then
          PULL_DEADLINE=86400
        fi
        # Exact lookup. The previous `ollama list | grep` form was an unanchored
        # regex, so a partial name matched an installed model and this helper
        # exited 0 without the configured model ever being present.
        if ollama show "$$TARGET_MODEL" > /dev/null 2>&1; then
          echo "Model $$TARGET_MODEL already exists."
        else
          echo "Pulling model $$TARGET_MODEL (deadline $${PULL_DEADLINE}s)..."
          # --kill-after escalates to SIGKILL, so a transfer that ignores SIGTERM
          # cannot outlive the deadline and wedge techjob-mcp indefinitely.
          timeout --kill-after=10s "$$PULL_DEADLINE" ollama pull "$$TARGET_MODEL"
        fi
        # Re-verify after the pull so a truncated or failed transfer cannot be
        # reported as readiness.
        ollama show "$$TARGET_MODEL" > /dev/null
        echo "Model $$TARGET_MODEL is ready."

volumes:
  ollama_data:
  prometheus_data:
  grafana_data:




