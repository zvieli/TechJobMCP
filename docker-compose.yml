services:
  techjob-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techjob-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./data:/app/data
      - ./job_mcp:/app/job_mcp
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - ./cv.pdf:/app/cv.pdf:ro
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - BROWSER_HEADLESS=true
      - BROWSER_PROFILE_DIR=/app/browser_profile
      - DEFAULT_CV_PATH=/app/cv.pdf
      - APPLICATION_LEDGER_PATH=/app/data/application_ledger.db
      - LLM_CACHE_PATH=/app/data/llm_cache.db
      - JOB_TRACKER_PATH=/app/data/job_tracker.json
      - OLLAMA_URL=http://ollama:11434/api/generate
      # Source timeouts are adaptive by default (10s-25s per source).
      # Optional override: SOURCE_TIMEOUT_SECONDS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: techjob-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $${OLLAMA_MODEL:-llama3.2} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5s

  ollama-model-pull:
    image: ollama/ollama:latest
    container_name: techjob-ollama-pull
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama daemon to respond..."
        while ! ollama list > /dev/null 2>&1; do
          sleep 1
        done
        TARGET_MODEL="$${OLLAMA_MODEL:-llama3.2}"
        if ollama list | grep -q "$$TARGET_MODEL"; then
          echo "Model $$TARGET_MODEL already exists."
        else
          echo "Pulling model $$TARGET_MODEL..."
          ollama pull "$$TARGET_MODEL"
        fi
        echo "Model $$TARGET_MODEL is ready."

volumes:
  ollama_data:




