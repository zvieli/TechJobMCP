services:
  hireme-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireme-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./browser_profile:/app/browser_profile
      - ./job_mcp:/app/job_mcp
      - ./cv.pdf:/app/cv.pdf:ro
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - BROWSER_HEADLESS=true
      - BROWSER_PROFILE_DIR=/app/browser_profile
      - DEFAULT_CV_PATH=/app/cv.pdf
      - CANDIDATE_EMAIL=candidate@example.com
      - CACHE_TTL_MINUTES=60
      - LOG_LEVEL=INFO


